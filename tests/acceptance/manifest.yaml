version: 1
checkpoint: foundation
qualified_release: false
source_state: initial-source-only
runtime_state: not-tested
integration_state: not-tested
release_status: not-qualified
families:
  - id: BUILD
    status: not-run
    description: Clean documented build, manifests and checksums, license/source closure, and ISO validity.
  - id: LIVE
    status: not-run
    description: Firmware boot, userspace, login, desktop, terminal, router, local model, health, and installer launch.
  - id: INSTALL
    status: not-run
    description: Actual Calamares automatic/manual GPT installs with offline handoff and no live residue.
  - id: DISK
    status: not-run
    description: ISO removed, installed-system boot, network, updates, local AI, terminal help, and reboot/shutdown.
  - id: OFFLINE
    status: not-run
    description: Guest NIC disconnected, local question answered, first boot skippable, and no hidden model download.
  - id: AI
    status: not-run
    description: Exact model identity, baseline and optimized CPU builds, bounded queue and memory, cancellation, and isolation.
  - id: TOOLS
    status: not-run
    description: Structured registry, schemas, provenance, permission handling, and safe package-plan workflow.
  - id: SHELL
    status: not-run
    description: Bash preservation, classification, bounded capture, and no automatic command execution.
  - id: HEALTH
    status: not-run
    description: Shared metrics, missing-sensor handling, sustained-condition detection, and no automatic remediation.
  - id: ROUTER
    status: not-run
    description: Four policies, startup/ready/fallback states, and clean midstream fallback.
  - id: PRIVACY
    status: not-run
    description: No secret leakage, exact consent, protected sockets, and denied access to forbidden provider state.
  - id: TRUST
    status: not-run
    description: Valid signatures, allowlist enforcement, and rejection of tampered or unsigned sources.
  - id: SECUREBOOT
    status: not-run
    description: OVMF boot-chain outcomes recorded without claiming unsupported physical-hardware certification.
