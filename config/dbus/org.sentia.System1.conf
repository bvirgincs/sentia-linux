<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.sentia.System1"/>
  </policy>
  <policy context="default">
    <deny own="org.sentia.System1"/>
    <deny send_destination="org.sentia.System1"/>
    <allow send_destination="org.sentia.System1" send_interface="org.sentia.System1"
           send_member="Prepare" send_type="method_call"/>
    <allow send_destination="org.sentia.System1" send_interface="org.sentia.System1"
           send_member="Apply" send_type="method_call"/>
    <allow send_destination="org.sentia.System1"
           send_interface="org.freedesktop.DBus.Introspectable"
           send_member="Introspect" send_type="method_call"/>
    <allow send_destination="org.sentia.System1"
           send_interface="org.freedesktop.DBus.Peer"
           send_member="Ping" send_type="method_call"/>
  </policy>
</busconfig>
