# Sentia override of live-build's isolinux/isolinux.cfg.
#
# Upstream ships `timeout 0`, which in syslinux means "wait forever". The BIOS
# boot path must auto-start the default entry like the UEFI path does.
#
# `serial` must come first for syslinux to honour it.
#
# Derived from live-build (GPL-3.0-or-later); Debian live-build team.

serial 0 115200
include menu.cfg
default vesamenu.c32
prompt 0
timeout 50
