# Sentia override of live-build's grub-pc/config.cfg.
#
# Upstream live-build ships this file with no `timeout`, which makes GRUB wait
# at the menu forever. That is not acceptable for an unattended boot, for a
# headless test guest, or for a user who simply expects the default entry to
# start. It also leaves GRUB on gfxterm only, so nothing from the boot menu is
# ever visible on a serial console.
#
# Derived from live-build (GPL-3.0-or-later); Debian live-build team.

set default=0
set timeout=5

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copied from the netinst image
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

insmod serial
if serial --unit=0 --speed=115200 ; then
    terminal_input console serial
    terminal_output gfxterm serial
else
    terminal_output gfxterm
fi
