# lightdm-gtk-greeter falls back to Debian's login-background.svg when no
# background is configured, which puts Debian branding on the Sentia login
# screen. The upstream lightdm-gtk-greeter.conf is a conffile shipped fully
# commented out, so Sentia sets this in a drop-in instead of editing it.
[greeter]
background=/usr/share/backgrounds/sentia/sentia-wallpaper.svg
user-background=false
