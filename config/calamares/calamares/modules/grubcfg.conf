# GRUB defaults written into the installed system.
#
# The live image has no /etc/default/grub, so this module creates it from
# scratch; overwrite keeps that deterministic instead of depending on whatever
# a future base image happens to ship.
overwrite: true

# kernel_params replaces the module's ["quiet"] default wholesale.
#
# console=tty0 comes last so /dev/console stays the virtual terminal, which is
# what a desktop expects. Listing ttyS0 as well makes systemd's getty generator
# offer a login on the serial port and sends kernel messages there: that is how
# the installed system is inspected under QEMU, and how a serial console works
# on hardware that has one. It costs nothing on machines without a UART.
kernel_params:
    - quiet
    - "console=ttyS0,115200"
    - console=tty0

defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "0"
    GRUB_DISABLE_SUBMENU: true
    GRUB_DISABLE_RECOVERY: false
    GRUB_TERMINAL_OUTPUT: "gfxterm"
