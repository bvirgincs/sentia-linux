# Bootloader configuration for Sentia installer
---
# "grub" runs grub-install in the target, which is how Debian installs its
# signed chain: with shim-signed and grub-efi-amd64-signed present it writes
# shimx64.efi and the signed grubx64.efi into EFI/debian and creates /boot/grub.
# Calamares' "sb-shim" path only runs efibootmgr and grub-mkconfig; it expects
# the ESP to have been populated by packaging, which Debian does not do.
efiBootLoader: "grub"

kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
fallback: "/initramfs-linux-fallback.img"
timeout: "10"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

efiBootloaderId: "debian"
installEFIFallback: true
