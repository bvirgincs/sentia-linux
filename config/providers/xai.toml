schema_version = 1
provider = "xai"
display_name = "xAI API (bring your own API key)"
enabled = false
live_tested = false
verification = "official_docs_and_offline_fixtures_only"

[api]
contract = "xAI Responses API"
endpoint = "https://api.x.ai/v1/responses"
endpoint_override_allowed = false
model = ""
model_validation = "syntax_only_no_remote_availability_claim"

[authentication]
kind = "provider_scoped_api_key"
handoff = "inherited_fd_3_only"

[capabilities]
text_generation = true
streaming = false
tool_calls = false
files = false
server_state = false

[billing]
kind = "separately_billed_api_usage"
consumer_subscription = "not_an_api_billing_entitlement"

[cli]
state = "held_unverified"
reason = "Grok Build subscription routing is held until entitlement and genuine no-tool operation are verified; the worker accepts only an xAI API key."
