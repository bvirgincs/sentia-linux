[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/sentia-protocol"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = { version = "0.1" }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3.31", features = ["sink"] }
hex = { version = "0.4" }
libc = { version = "0.2.177" }
nix = { version = "0.29", default-features = false, features = ["fs"] }
rand = { version = "0.8" }
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls-webpki-roots", "stream"] }
rusqlite = { version = "0.37" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145" }
sha2 = { version = "0.10.9" }
thiserror = { version = "2.0.16" }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
toml = { version = "0.9" }
url = { version = "2.5" }
walkdir = { version = "2.5" }
zbus = { version = "4.4", default-features = false, features = ["tokio"] }
