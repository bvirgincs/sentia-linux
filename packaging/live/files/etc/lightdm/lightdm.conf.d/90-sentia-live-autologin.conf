# Live-session autologin.
#
# This file ships only in sentia-live, which Calamares removes from the
# installed system, so an installed Sentia still asks for a password.
#
# Autologin matters beyond convenience: the AI router is a per-user service,
# so without a real user session there is no user systemd manager and no
# router socket for the desktop or the ai(1) client to talk to.
#
# "user" is the account live-config creates for the live session. Debian's
# /etc/pam.d/lightdm-autologin permits any non-root account, so no extra group
# membership is required.
[Seat:*]
autologin-user=user
autologin-user-timeout=0
autologin-session=xfce
