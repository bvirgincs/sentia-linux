[package]
name = "sentia-router"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"
description = "Per-user privacy-preserving AI router for Sentia Linux"
publish = false

[lib]
name = "sentia_router"
path = "src/lib.rs"

[[bin]]
name = "sentia-router"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sentia-protocol = { path = "../sentia-protocol" }
sentia-local-broker = { path = "../sentia-local-broker" }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
