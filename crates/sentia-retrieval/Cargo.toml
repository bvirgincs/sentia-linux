[package]
name = "sentia-retrieval"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native local retrieval index and query engine for Sentia"

[lib]
name = "sentia_retrieval"
path = "src/lib.rs"

[[bin]]
name = "sentia-retrieval"
path = "src/main.rs"

[[test]]
name = "local_retrieval"
path = "../../tests/retrieval/local_retrieval.rs"

[features]
default = []
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
flate2 = { version = "1.1.0", default-features = false, features = ["rust_backend"] }
libc = "0.2.177"
rusqlite = "0.37.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.16"
toml = "0.9.7"
walkdir = "2.5.0"

[dev-dependencies]
serde_json = "1.0.145"
