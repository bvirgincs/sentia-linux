[package]
name = "sentia-retrieval"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native local retrieval index and query engine for Sentia"

[lib]
name = "sentia_retrieval"
path = "src/lib.rs"

[[bin]]
name = "sentia-retrieval"
path = "src/main.rs"

[[test]]
name = "local_retrieval"
path = "../../tests/retrieval/local_retrieval.rs"

[features]
default = []
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
flate2 = { workspace = true }
libc = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
