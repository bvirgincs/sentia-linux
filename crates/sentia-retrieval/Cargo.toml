[package]
name = "sentia-retrieval"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native local retrieval index and query engine for Sentia"

[lib]
name = "sentia_retrieval"
path = "src/lib.rs"

[[bin]]
name = "sentia-retrieval"
path = "src/main.rs"

[[test]]
name = "local_retrieval"
path = "../../tests/retrieval/local_retrieval.rs"

[features]
default = []
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
flate2 = { version = "=1.0.28", default-features = false, features = ["rust_backend"] }
libc = "=0.2.149"
rusqlite = "=0.29.0"
serde = { version = "=1.0.188", features = ["derive"] }
serde_json = "=1.0.107"
sha2 = "=0.10.7"
thiserror = "=1.0.50"
toml = "=0.5.11"
walkdir = "=2.4.0"

[dev-dependencies]
serde_json = "=1.0.107"
