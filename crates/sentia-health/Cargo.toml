[package]
name = "sentia-health"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Sentia native health metrics collector and daemon"

[lib]
name = "sentia_health"
path = "src/lib.rs"

[[bin]]
name = "sentia-health"
path = "src/main.rs"

[dependencies]
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"

[[test]]
name = "health-proc"
path = "../../tests/health/proc_parsing.rs"

[[test]]
name = "health-alerts"
path = "../../tests/health/alerts.rs"

[[test]]
name = "health-host-snapshot"
path = "../../tests/health/host_snapshot.rs"
