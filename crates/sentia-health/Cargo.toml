[package]
name = "sentia-health"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Sentia native health metrics collector and daemon"

[lib]
name = "sentia_health"
path = "src/lib.rs"

[[bin]]
name = "sentia-health"
path = "src/main.rs"

[dependencies]
libc = { workspace = true }
nix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[[test]]
name = "health-proc"
path = "../../tests/health/proc_parsing.rs"

[[test]]
name = "health-alerts"
path = "../../tests/health/alerts.rs"

[[test]]
name = "health-host-snapshot"
path = "../../tests/health/host_snapshot.rs"
