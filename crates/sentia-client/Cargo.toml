[package]
name = "sentia-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"
description = "Native command-line client for the Sentia AI router"
publish = false

[[bin]]
name = "ai"
path = "src/main.rs"

[dependencies]
libc = { workspace = true }
serde_json = { workspace = true }
sentia-protocol = { path = "../sentia-protocol" }
sentia-router = { path = "../sentia-router" }
tokio = { workspace = true }
