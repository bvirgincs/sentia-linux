[package]
name = "sentia-providers"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Isolated BYOK API provider workers for Sentia Linux"
publish = false

[lib]
name = "sentia_providers"
path = "src/lib.rs"

[[bin]]
name = "sentia-provider-worker"
path = "src/bin/sentia-provider-worker.rs"

[dependencies]
futures-util = { version = "=0.3.31", features = ["sink"] }
libc = "=0.2.155"
reqwest = { version = "=0.12.4", default-features = false, features = ["http2", "json", "rustls-tls-webpki-roots", "stream"] }
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
tokio = { version = "=1.37.0", features = ["io-std", "macros", "rt-multi-thread", "time"] }
tokio-util = { version = "=0.7.11", features = ["codec"] }
url = "=2.5.0"
