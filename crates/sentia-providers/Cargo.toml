[package]
name = "sentia-providers"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Isolated BYOK API provider workers for Sentia Linux"
publish = false

[lib]
name = "sentia_providers"
path = "src/lib.rs"

[[bin]]
name = "sentia-provider-worker"
path = "src/bin/sentia-provider-worker.rs"

[dependencies]
futures-util = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
