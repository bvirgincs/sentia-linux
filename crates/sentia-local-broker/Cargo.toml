[package]
name = "sentia-local-broker"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"
description = "Peer-authenticated local inference broker for Sentia Linux"
publish = false

[[bin]]
name = "sentia-local-broker"
path = "src/main.rs"

[dependencies]
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sentia-protocol = { path = "../sentia-protocol" }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
